name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  core-tests:
    name: GlassOTPCore Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          swift --version
          xcodebuild -version

      - name: Run Swift package tests
        working-directory: Packages/GlassOTPCore
        run: swift test

      - name: Verify open-source secret and team scrubbing
        run: |
          if grep -rnE --exclude-dir=.build "DEVELOPMENT_TEAM\s*[:=]\s*[\"']?[A-Z0-9]{10}|[0-9A-F]{8}-[0-9A-F]{16}" \
            Config GlassOTP GlassOTP.xcodeproj GlassOTPWidget GlassOTPMac Packages Shared project.yml README.md SECURITY.md CONTRIBUTING.md .github; then
            echo "Found untracked team or device identifiers!"
            exit 1
          fi
