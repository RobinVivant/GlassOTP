name: Feature Request
description: Suggest an improvement, importer format, or brand logo
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / Export Format
        - Brand Logo / Categorization
        - iOS App / Widgets
        - macOS Menu Bar App
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What would you like to add or improve?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context or format links
      description: For new import formats, link public format documentation if available (never upload personal exports).
