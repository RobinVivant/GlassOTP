name: Bug Report
description: Report a bug in GlassOTP (iOS, Widget, or macOS)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS App
        - Home / Lock Screen Widget
        - macOS Menu Bar App (GlassOTPMac)
        - Core Package / Importer
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS & App Version
      placeholder: e.g. iOS 27.2 / macOS 27.2 / GlassOTP 1.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue clearly. Never paste real OTP secrets or backup passwords.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open GlassOTP...
        2. Tap...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
